services:
  web:
    build: .
    command: uvicorn workbench.web:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-medium}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-16384}
      WORKBENCH_DATA_DIR: /app/data/workbench
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-census-media}
      WORKBENCH_PUBLIC_ORIGIN: ${WORKBENCH_PUBLIC_ORIGIN:-http://localhost:8000}
      WORKBENCH_MAX_MODEL_CALLS_PER_RUN: ${WORKBENCH_MAX_MODEL_CALLS_PER_RUN:-0}
      WORKBENCH_MAX_PAGES_PER_RUN: ${WORKBENCH_MAX_PAGES_PER_RUN:-10}
      WORKBENCH_MAX_UPLOAD_BYTES: ${WORKBENCH_MAX_UPLOAD_BYTES:-26214400}
      WORKBENCH_ALLOWED_DOMAINS: ${WORKBENCH_ALLOWED_DOMAINS:-utexas.edu,eid.utexas.edu,my.utexas.edu}
      WORKBENCH_ALLOWED_EMAILS: ${WORKBENCH_ALLOWED_EMAILS:-}
      WORKBENCH_BACKEND: ${WORKBENCH_BACKEND:-local}
      WORKBENCH_EXTRACTION_ENABLED: ${WORKBENCH_EXTRACTION_ENABLED:-false}
    volumes:
      - ./data/workbench:/app/data/workbench
  worker:
    build: .
    command: python -m workbench.worker
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-medium}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-16384}
      WORKBENCH_DATA_DIR: /app/data/workbench
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-census-media}
      WORKBENCH_PUBLIC_ORIGIN: ${WORKBENCH_PUBLIC_ORIGIN:-http://localhost:8000}
      WORKBENCH_MAX_MODEL_CALLS_PER_RUN: ${WORKBENCH_MAX_MODEL_CALLS_PER_RUN:-0}
      WORKBENCH_MAX_PAGES_PER_RUN: ${WORKBENCH_MAX_PAGES_PER_RUN:-10}
      WORKBENCH_MAX_UPLOAD_BYTES: ${WORKBENCH_MAX_UPLOAD_BYTES:-26214400}
      WORKBENCH_ALLOWED_DOMAINS: ${WORKBENCH_ALLOWED_DOMAINS:-utexas.edu,eid.utexas.edu,my.utexas.edu}
      WORKBENCH_ALLOWED_EMAILS: ${WORKBENCH_ALLOWED_EMAILS:-}
      WORKBENCH_BACKEND: ${WORKBENCH_BACKEND:-local}
      WORKBENCH_EXTRACTION_ENABLED: ${WORKBENCH_EXTRACTION_ENABLED:-false}
    volumes:
      - ./data/workbench:/app/data/workbench
